[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agentic-lab"
version = "0.1.0"
description = "Local-first AI product development team: an interactive, persistent, multi-agent platform"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.40.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lab*", "minishop*"]

[project.scripts]
product-team = "lab.cli:main"

[tool.setuptools.package-data]
minishop = ["templates/*", "static/*"]
"lab.config" = ["*.yaml"]
"lab.playbooks" = ["*.md"]
"lab.roles" = ["prompts/*.md", "prompts/team/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests that require a running Ollama instance (deselect with '-m not live')",
]
log_cli = true
log_cli_level = "INFO"
