[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-agentic-lab"
version = "0.1.0"
description = "Local-first, model-independent agentic software delivery lab — Milestone 1 PoC"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.40.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests that require a running Ollama instance (deselect with '-m not live')",
]
log_cli = true
log_cli_level = "INFO"
